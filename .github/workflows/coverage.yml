name: Coverage

# Measures formal coverage, checks that COVERAGE.md and coverage/baseline.json match the
# measurement, and applies the ratchet from AGENTS.md against the merge base.
# State lives in git: coverage/baseline.json on main is the floor. No step commits to main.
# The proof-to-code ratio is informational. Every other step is blocking.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  HAX_COMMIT: 5ccf89dd2e996c9f88f2267eaa2a64739c4ca41a

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      ratchet: ${{ steps.coverage.outputs.ratchet }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: cryspen/hax
          ref: ${{ env.HAX_COMMIT }}
          path: hax-src
      - uses: ./.github/actions/setup-hax
        with:
          fstar: v2025.10.06
          hax_commit: ${{ env.HAX_COMMIT }}
      - name: Fresh hax extraction and strict F*
        env:
          HAX_CORE_LIBS: ${{ github.workspace }}/hax-src/proof-libs/fstar
          HAX_LIB_PROOFS: ${{ github.workspace }}/hax-src/hax-lib/proofs/fstar/extraction
        run: |
          eval "$(opam env 2>/dev/null || true)"
          FSTAR_JOBS="$(nproc)" python3 scripts/verify-fstar.py

      - name: Measure, check committed outputs and apply ratchet
        id: coverage
        uses: gumshoe2020/formal-coverage/.github/actions/coverage@2c7e26a8c90afb44323ecebce69822e8b4bc9ca5 # v1.9.0
        with:
          report-args: '["--fstar-log","target/ci-logs/fstar/fstar.log"]'

      - name: Keep F* receipts and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: |
            target/ci-logs/fstar/*.log
            target/ci-logs/fstar/*.json
            target/ci-logs/fstar/interface-only.json

  badges:
    # Only on main. Writes shields.io endpoint JSON to the badges branch with the
    # default GITHUB_TOKEN. Never touches main.
    needs: coverage
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.coverage.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Publish to the badges branch
        uses: gumshoe2020/formal-coverage/.github/actions/publish-badges@2c7e26a8c90afb44323ecebce69822e8b4bc9ca5 # v1.9.0
        with:
          coverage-result: ${{ needs.coverage.result }}

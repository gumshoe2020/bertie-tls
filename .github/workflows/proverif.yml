name: proverif

# Regenerates the ProVerif model with the pinned hax, fails if the committed
# model is stale, then runs ProVerif and compares every query with
# proofs/proverif/expected-results.txt (queries 1 and 2 are the non-vacuity guard).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  HAX_COMMIT: 5ccf89dd2e996c9f88f2267eaa2a64739c4ca41a

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proverif:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Detect whether this change touches anything ProVerif reads
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 scripts/ci-changes.py --job proverif ${BASE_SHA:+"$BASE_SHA"}
      - name: Skipped, nothing ProVerif reads changed
        if: steps.changes.outputs.relevant != 'true'
        run: echo "No extraction or ProVerif input changed in this pull request; skipping ProVerif (push and dispatch always run it)."
      - if: steps.changes.outputs.relevant == 'true'
        uses: ./.github/actions/setup-hax
        with:
          fstar: v2025.10.06
          hax_commit: ${{ env.HAX_COMMIT }}
      - if: steps.changes.outputs.relevant == 'true'
        uses: ./.github/actions/setup-proverif
      - name: Regenerate the model and require it to match the committed one
        if: steps.changes.outputs.relevant == 'true'
        run: |
          eval "$(opam env 2>/dev/null || true)"
          cargo fetch --locked
          python3 hax-driver.py extract-proverif
          git diff --exit-code -- proofs/proverif/extraction
      - name: Run ProVerif and compare with expected results
        if: steps.changes.outputs.relevant == 'true'
        run: python3 scripts/check-proverif --timeout 3600
      - name: Keep logs
        if: always() && steps.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: proverif-logs
          path: target/proverif/analysis.log

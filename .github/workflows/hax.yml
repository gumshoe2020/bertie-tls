name: hax

# Fresh hax extraction plus strict F* on every module, nothing cached or patched.
# coverage.yml runs the same script and then measures; this workflow is the
# proofs-only signal and the nightly check.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  HAX_COMMIT: 5ccf89dd2e996c9f88f2267eaa2a64739c4ca41a

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hax:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: cryspen/hax
          ref: ${{ env.HAX_COMMIT }}
          path: hax-src
      - uses: hacspec/hax-actions@1f01b89579f425ad7c1e66aebbd5df7e688cb576 # main, pinned
        with:
          fstar: v2025.10.06
          hax_reference: ${{ env.HAX_COMMIT }}
      - name: Extract and verify every module
        env:
          HAX_CORE_LIBS: ${{ github.workspace }}/hax-src/proof-libs/fstar
          HAX_LIB_PROOFS: ${{ github.workspace }}/hax-src/hax-lib/proofs/fstar/extraction
        run: |
          eval "$(opam env 2>/dev/null || true)"
          python3 scripts/verify-fstar.py
      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fstar-logs
          path: |
            target/ci-logs/fstar/*.log
            target/ci-logs/fstar/*.json

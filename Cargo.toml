[package]
name = "bertie-tls"
version = "0.1.0-pre.2"
authors = ["Karthikeyan Bhargavan <karthik@cryspen.com>"]
license = "Apache-2.0"
edition = "2021"
documentation = "https://docs.rs/bertie-tls"
description = "Minimal TLS 1.3 implementation"
readme = "README.md"
repository = "https://github.com/gumshoe2020/bertie-tls"

[lib]
name = "bertie_tls"
path = "src/lib.rs"

[dependencies]
backtrace = "0.3.0"
rand = "0.9"
hex = "0.4.3"
tracing = "0.1"
libcrux-kem = { version = "0.0.10" }
rand_core = "0.10"
libcrux-sha2 = { version = "0.0.3-alpha.1" }
libcrux-hmac = { version = "0.0.3-alpha.1" }
libcrux-hkdf = { version = "0.0.3-alpha.1" }
libcrux-chacha20poly1305 = { version = "0.0.9", optional = true }
libcrux-rsa = { version = "0.0.2", optional = true }
libcrux-ed25519 = { version = "0.0.9", optional = true }
libcrux-ecdsa = { version = "0.0.3-alpha.1", features = ["rand"], optional = true }
hax-lib = { version = "0.4.2" }

[features]
default = ["api", "std", "defensive", "client", "chacha20poly1305", "ecdsa-p256", "rsa", "ed25519", "x25519", "p256", "mlkem768", "sha256", "sha384", "sha512"]
chacha20poly1305 = ["std", "dep:libcrux-chacha20poly1305"]
ecdsa-p256 = ["std", "dep:libcrux-ecdsa"]
rsa = ["std", "dep:libcrux-rsa"]
ed25519 = ["std", "dep:libcrux-ed25519"]
x25519 = ["std"]
p256 = ["std"]
mlkem768 = ["std"]
sha256 = ["std"]
sha384 = ["std"]
sha512 = ["std"]
defensive = []
std = []
test_utils = []
secret_integers = []
api = []
client = []
hax-fstar = []
hax-pv = []

[dev-dependencies]
bertie-tls = { path = ".", default-features = false, features = ["test_utils", "client"] }
dhat = "0.3.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
rayon = "1.3.0"
criterion = "0.5"
psm = "0.1.24"
bytesize = "1.3.0"

[[bench]]
name = "client"
harness = false

[[bench]]
name = "client_stack"
harness = false

[[bench]]
name = "server"
harness = false

[workspace]
members = [
    ".",
    "record",
    "simple_https_client",
    "simple_https_server",
    "bogo_shim",
    "integration_tests",
]

default-members = [
    ".",
    "record",
    "simple_https_client",
    "simple_https_server",
    "bogo_shim",
    "integration_tests",
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(bench)', 'cfg(hax)'] }
